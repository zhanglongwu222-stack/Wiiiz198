name: Auto Update Stock Market

on:
  schedule:
    # 每 5 分鐘自動執行一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允許在 GitHub 頁面手動點擊觸發

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Stock Update Script
        run: node index.js
